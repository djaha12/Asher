# Одноразовый: убрать с сервера демо-версию, поставленную для App Store.
# От приложения для iPhone отказались — система остаётся сайтом. Файл
# удаляется следующим же изменением, после того как отработает.
name: Убрать демо-версию с сервера

on:
  workflow_dispatch:

jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: '77.235.20.172'
      PORT: '8369'
      SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
    steps:
      - name: Ставлю sshpass
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Убираю демо-версию
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 -p "$PORT" "root@$HOST" 'bash -s' <<'REMOTE'
          set -u
          systemctl disable --now asher-demo-reset.timer 2>/dev/null || true
          systemctl disable --now asher-demo.service 2>/dev/null || true
          rm -f /etc/systemd/system/asher-demo.service \
                /etc/systemd/system/asher-demo-reset.service \
                /etc/systemd/system/asher-demo-reset.timer \
                /usr/local/sbin/asher-demo-reset
          rm -rf /etc/systemd/system/asher-demo.service.d /home/asher/demo
          # Ключа уведомлений не ставили, но если бы стоял — убираем и его.
          RESTART_MAIN=0
          if [ -f /etc/systemd/system/asher.service.d/apns.conf ]; then
            rm -f /etc/systemd/system/asher.service.d/apns.conf
            RESTART_MAIN=1
          fi
          rmdir /etc/systemd/system/asher.service.d 2>/dev/null || true
          rm -rf /etc/asher
          # Адрес demo в Caddy не добавлялся (записи у домена не было); на всякий случай.
          if [ -f /etc/caddy/Caddyfile.до-демо ]; then
            cp /etc/caddy/Caddyfile.до-демо /etc/caddy/Caddyfile
            rm -f /etc/caddy/Caddyfile.до-демо
            systemctl reload caddy || true
          fi
          systemctl daemon-reload
          if [ "$RESTART_MAIN" = 1 ]; then systemctl restart asher; sleep 3; fi
          echo "--- что осталось ---"
          echo "служба демо: $(systemctl is-active asher-demo 2>/dev/null || true)"
          echo "таймер демо: $(systemctl is-active asher-demo-reset.timer 2>/dev/null || true)"
          echo "папка демо: $([ -e /home/asher/demo ] && echo есть || echo нет)"
          echo "порт 3001: $(ss -lnt | awk '{print $4}' | grep -c ':3001$') слушателей"
          echo "рабочая система: $(systemctl is-active asher)"
          curl -fsS --max-time 5 http://127.0.0.1:3000/api/ping && echo
          REMOTE
