# Сервер для приложения на iPhone: демо-версия и ключ уведомлений.
#
# Ставит на сервер то, без чего приложение не пройдёт проверку Apple и не
# сможет присылать уведомления, — через ДЕМО-И-УВЕДОМЛЕНИЯ.sh (что именно он
# делает, написано в самом файле). Рабочую систему не трогает, кроме одного:
# если прислан новый ключ уведомлений, она перезапускается с ним — и сама
# возвращается как было, если с ключом не поднялась.
#
# Запуск: Actions → «Сервер для приложения» → Run workflow. Повторять можно
# сколько угодно — например, после того как у домена появилась запись demo.
#
# Секреты: SERVER_ROOT_PASSWORD (как у обновления сервера);
# для уведомлений — APNS_KEY_ID и APNS_KEY_P8 (ключ Apple Push Notifications)
# и ключ App Store Connect (ASC_ISSUER_ID, ASC_KEY_ID, ASC_KEY_P8) — по нему
# робот узнаёт номер команды разработчика. Вместо ключа App Store Connect
# номер команды можно положить в секрет APPLE_TEAM_ID.
name: Сервер для приложения

on:
  workflow_dispatch:
    inputs:
      host:
        description: Адрес сервера
        required: true
        default: '77.235.20.172'
      port:
        description: Порт входа на сервер (SSH)
        required: true
        default: '8369'
      domain:
        description: Домен рабочей системы (демо-версия будет на demo.домен)
        required: true
        default: 'diamonds.kg'

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ inputs.host || '77.235.20.172' }}
      PORT: ${{ inputs.port || '8369' }}
      DOMAIN: ${{ inputs.domain || 'diamonds.kg' }}
      SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверяю, что секрет с паролем сервера задан
        run: |
          if [ -z "$SSHPASS" ]; then
            echo "::error::Не задан секрет SERVER_ROOT_PASSWORD."
            exit 1
          fi
          echo "секрет на месте"

      - name: Ставлю sshpass
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Ключ уведомлений и номер команды
        id: push
        run: |
          if [ -z "$APNS_KEY_ID" ] || [ -z "$APNS_KEY_P8" ]; then
            echo "Ключа уведомлений нет (секреты APNS_KEY_ID и APNS_KEY_P8) — ставлю только демо-версию."
            exit 0
          fi
          if [ -n "$APPLE_TEAM_ID" ]; then
            echo "team_id=$APPLE_TEAM_ID" >> "$GITHUB_OUTPUT"
          elif [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            node ios/tools/appstore.mjs team
          else
            echo "::error::Для уведомлений нужен номер команды разработчика: добавьте ключ App Store Connect (ASC_ISSUER_ID, ASC_KEY_ID, ASC_KEY_P8) или секрет APPLE_TEAM_ID."
            exit 1
          fi
          node ios/tools/appstore.mjs pem --env APNS_KEY_P8 --out "$RUNNER_TEMP/apns.p8"

      - name: Ставлю на сервер
        env:
          TEAM_ID: ${{ steps.push.outputs.team_id }}
        run: |
          OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
          DIR=/root/asher-app-setup
          sshpass -e ssh $OPTS -p "$PORT" "root@$HOST" "rm -rf $DIR && mkdir -m 700 $DIR"
          sshpass -e scp $OPTS -P "$PORT" ДЕМО-И-УВЕДОМЛЕНИЯ.sh "root@$HOST:$DIR/setup.sh"
          ARGS="$DOMAIN"
          if [ -n "$TEAM_ID" ] && [ -f "$RUNNER_TEMP/apns.p8" ]; then
            sshpass -e scp $OPTS -P "$PORT" "$RUNNER_TEMP/apns.p8" "root@$HOST:$DIR/apns.p8"
            ARGS="$DOMAIN $DIR/apns.p8 $APNS_KEY_ID $TEAM_ID"
          fi
          rm -f "$RUNNER_TEMP/apns.p8"
          # Временную папку с ключом убираем на сервере при любом исходе.
          RC=0
          sshpass -e ssh $OPTS -o ServerAliveInterval=30 -p "$PORT" "root@$HOST" \
            "bash $DIR/setup.sh $ARGS; rc=\$?; rm -rf $DIR; exit \$rc" || RC=$?
          exit "$RC"

      - name: Проверяю демо-версию снаружи
        run: |
          for try in 1 2 3 4 5 6; do
            if curl -fsS --max-time 15 "https://demo.$DOMAIN/api/login-hint" 2>/dev/null | grep -q '"demo":true'; then
              echo "https://demo.$DOMAIN открывается — проверяющий Apple сможет войти (admin / admin123)."
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://demo.$DOMAIN снаружи не открывается. Если у домена ещё нет записи demo — добавьте её у регистратора (тип A, имя demo, адрес как у $DOMAIN) и запустите этого робота ещё раз."
          exit 1
