# Обновление системы на сервере руками робота GitHub.
#
# Отдельно от установки, и намеренно. Установка разворачивает систему на
# чистом сервере; обновление трогает работающую кассу магазина, и цена ошибки
# здесь другая: продавцы стоят у прилавка. Поэтому обновление идёт не через
# установщик, а через ОБНОВИТЬ-НА-СЕРВЕРЕ.sh — он снимает копию базы ДО того,
# как что-то менять, проверяет, что система поднялась и отвечает, и сам
# возвращает прежнюю версию, если не поднялась. Худший исход — «осталось
# как было».
#
# Запуск: кнопкой в разделе Actions (если файл в основной ветке) либо
# появлением ветки update-now — так же, как у установки.
name: Обновление сервера

on:
  workflow_dispatch:
    inputs:
      host:
        description: Адрес сервера
        required: true
      port:
        description: Порт входа на сервер (SSH)
        required: true
        default: '22'
      domain:
        description: Домен — по нему проверяется, что система жива
        required: true
      store_name:
        description: Название магазина — если заполнить, будет поставлено на сервере
        required: false
        default: ''
      site_note:
        description: Подпись на экране входа — например «в разработке»
        required: false
        default: ''
      discard_local_changes:
        description: Стереть правки в папке системы на сервере (только осознанно!)
        required: false
        type: boolean
        default: false
  push:
    branches: [update-now]

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ inputs.host || '77.235.20.172' }}
      PORT: ${{ inputs.port || '8369' }}
      DOMAIN: ${{ inputs.domain || 'diamonds.kg' }}
      STORE_NAME: ${{ inputs.store_name || '' }}
      SITE_NOTE: ${{ inputs.site_note || '' }}
      SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
    steps:
      - name: Проверяю, что секрет с паролем сервера задан
        run: |
          if [ -z "$SSHPASS" ]; then
            echo "Не задан секрет SERVER_ROOT_PASSWORD."
            exit 1
          fi
          echo "секрет на месте"

      - name: Ставлю sshpass
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null

      - name: Смотрю, что сейчас стоит на сервере
        run: |
          # Печатаем и список изменённых файлов. Обновление отказывается идти,
          # когда в папке системы есть правки, — и это правильно, оно их не
          # затирает. Но без списка непонятно, чьи это правки: чинил ли кто-то
          # что-то руками на живом сервере, или git считает файл изменённым
          # из-за переводов строк. Разбираться в этом вслепую — потерянный час.
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 -o NumberOfPasswordPrompts=1 -p "$PORT" "root@$HOST" \
            'cd /home/asher/app \
             && echo "ветка:  $(sudo -u asher git rev-parse --abbrev-ref HEAD)" \
             && echo "версия: $(sudo -u asher git rev-parse --short HEAD)" \
             && echo "служба: $(systemctl is-active asher)" \
             && echo "--- изменённые файлы (пусто — значит чисто) ---" \
             && sudo -u asher git status --porcelain \
             && echo "--- чем именно отличаются ---" \
             && sudo -u asher git diff --stat'

      - name: Обновляю — с копией до и откатом при неудаче
        run: |
          # Галочка «стереть правки» передаётся самому скрипту обновления,
          # а не выполняется отдельной командой рядом. Разница принципиальна:
          # внутри скрипта останутся копия базы до всего остального, проверка
          # что система поднялась, и откат при неудаче. Чинить папку сбоку —
          # значит остаться без всего этого ровно в тот момент, когда что-то
          # уже пошло не так.
          FLAG=""
          if [ "${{ inputs.discard_local_changes }}" = "true" ]; then
            FLAG="--force"
            echo "запрошено стирание правок в папке системы"
          fi
          RC=0
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -p "$PORT" "root@$HOST" \
            "curl -sL https://raw.githubusercontent.com/djaha12/Asher/HEAD/update.sh | bash -s -- /home/asher/app $FLAG" \
            >обновление.log 2>&1 || RC=$?
          # Пароли скрипт обновления не печатает, но фильтр оставляем на случай,
          # если однажды начнёт: журнал запуска в открытом репозитории виден всем.
          grep -v -iE 'пароль|password' обновление.log | tail -80
          exit "$RC"

      - name: Ставлю название и подпись, если их прислали
        if: ${{ inputs.store_name != '' || inputs.site_note != '' }}
        run: |
          # Оба значения уезжают вводом, а не строкой команды: в них бывают
          # кавычки и пробелы, а строка команды ещё и видна в журнале ssh.
          # Пустое значение означает «не трогать»: так можно поменять подпись,
          # не переписывая название, и наоборот.
          printf '%s\n%s\n' "$STORE_NAME" "$SITE_NOTE" | sshpass -e ssh \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -p "$PORT" "root@$HOST" \
            'read -r NAME || true; read -r NOTE || true;
             cd /home/asher/app && sudo -u asher env ASHER_NAME="$NAME" ASHER_NOTE="$NOTE" node -e "
               const { setSetting, getSetting } = require(\"./src/db\");
               if (process.env.ASHER_NAME) setSetting(\"store_name\", process.env.ASHER_NAME);
               if (process.env.ASHER_NOTE) setSetting(\"site_note\", process.env.ASHER_NOTE);
               console.log(\"название: \" + getSetting(\"store_name\"));
               console.log(\"подпись:  \" + (getSetting(\"site_note\") || \"(пусто)\"));
             "'

      - name: Проверяю, что сайт отвечает после обновления
        if: ${{ always() }}
        run: |
          # Имя счётчика латиницей: bash кириллические имена переменных
          # не принимает и молча пропускает весь цикл — проверка тогда
          # не проверяет ничего, а в журнал пишет уверенный ответ.
          for try in 1 2 3 4 5 6; do
            if curl -s --max-time 20 "https://$DOMAIN/api/ping" | grep -q asher; then
              echo
              echo "==================================================="
              echo "  https://$DOMAIN отвечает. Обновление прошло."
              echo "==================================================="
              exit 0
            fi
            echo "попытка $try: сайт пока молчит, жду 15 секунд"
            sleep 15
          done
          echo
          echo "https://$DOMAIN не ответил за полторы минуты."
          echo "Скрипт обновления возвращает прежнюю версию сам, если система не поднялась,"
          echo "поэтому магазин, скорее всего, работает на старой версии — проверьте сайт."
          echo "Что смотреть на сервере: journalctl -u asher -n 50"
          exit 1
