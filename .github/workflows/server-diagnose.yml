# Диагностика сервера — только смотрит, ничего не меняет.
#
# Когда сайт «не открывается», первое, что нужно знать: жив ли сам сервер,
# работают ли Caddy и система, есть ли место на диске и память, что система
# писала в журнал перед тем, как замолчать. Всё это видно только изнутри
# сервера, а консоль хостинга владельцу неудобна — поэтому смотрит робот.
#
# Журнал запуска в открытом репозитории виден всем: адреса посетителей
# в выводе заменяются на x.x.x.x, строки журнала обрезаются.
name: Диагностика сервера

on:
  workflow_dispatch:
    inputs:
      host:
        description: Адрес сервера
        required: true
        default: '212.112.105.196'
      port:
        description: Порт входа на сервер (SSH)
        required: true
        default: '8369'
      domain:
        description: Домен
        required: true
        default: 'diamonds.kg'
  push:
    branches: [diagnose-now, claude/magical-dirac-sb1dum]
    paths: [.github/workflows/server-diagnose.yml]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ inputs.host || '212.112.105.196' }}
      PORT: ${{ inputs.port || '8369' }}
      DOMAIN: ${{ inputs.domain || 'diamonds.kg' }}
      ALT_HOSTS: '77.235.20.172'
      SSHPASS: ${{ secrets.SERVER_ROOT_PASSWORD }}
    steps:
      - name: Снаружи — как сайт видят покупатели и продавцы
        continue-on-error: true
        run: |
          echo "--- адрес домена ---"
          getent ahostsv4 "$DOMAIN" | awk '{print $1}' | sort -u || echo "домен не находится"
          # У сервера в панели хостинга два внешних адреса. Домен смотрит на
          # один; если хостинг сменил адрес, сайт отвечает только по другому.
          echo "--- порты сервера снаружи ---"
          for h in $HOST $ALT_HOSTS; do
            for p in 80 443 "$PORT"; do
              if timeout 12 bash -c "</dev/tcp/$h/$p" 2>/dev/null; then
                echo "$h порт $p: открыт"
              else
                echo "$h порт $p: НЕ ОТВЕЧАЕТ"
              fi
            done
          done
          for h in $ALT_HOSTS; do
            echo "--- сайт по адресу $h ---"
            curl -sS --max-time 20 -o /dev/null -w "код %{http_code}, всего %{time_total}s\n" \
              --resolve "$DOMAIN:443:$h" "https://$DOMAIN/api/ping" || echo "(не ответил)"
          done
          echo "--- https://$DOMAIN/api/ping ---"
          curl -sS --max-time 25 -o ping.txt \
            -w "код %{http_code}, соединение %{time_connect}s, tls %{time_appconnect}s, ответ %{time_starttransfer}s, всего %{time_total}s\n" \
            "https://$DOMAIN/api/ping" || echo "(curl не дождался ответа)"
          head -c 300 ping.txt 2>/dev/null || true; echo
          echo "--- главная страница ---"
          curl -sS --max-time 25 -o /dev/null \
            -w "код %{http_code}, всего %{time_total}s, %{size_download} байт\n" \
            "https://$DOMAIN/" || echo "(curl не дождался ответа)"
          echo "--- сертификат ---"
          echo | timeout 20 openssl s_client -connect "$HOST:443" -servername "$DOMAIN" 2>/dev/null \
            | openssl x509 -noout -subject -dates 2>/dev/null || echo "сертификат получить не удалось"

      - name: Изнутри сервера
        if: ${{ always() }}
        run: |
          if [ -z "$SSHPASS" ]; then echo "Не задан секрет SERVER_ROOT_PASSWORD."; exit 1; fi
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          # Входим по тому адресу, на котором порт входа открыт.
          for h in $HOST $ALT_HOSTS; do
            if timeout 12 bash -c "</dev/tcp/$h/$PORT" 2>/dev/null; then HOST=$h; break; fi
          done
          echo "вход через $HOST"
          RC=0
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=25 -o NumberOfPasswordPrompts=1 -p "$PORT" "root@$HOST" \
            "DOMAIN='$DOMAIN' bash -s" >изнутри.log 2>&1 <<'REMOTE' || RC=$?
          mask() { sed -E 's/([0-9]{1,3}\.){3}[0-9]{1,3}/x.x.x.x/g' | cut -c1-240; }
          echo "=== время и работа сервера ==="
          date; uptime
          echo "--- перезагрузки ---"
          journalctl --list-boots --no-pager 2>/dev/null | tail -4
          echo "=== диск ==="
          df -h / /home 2>/dev/null | sort -u
          df -i / | tail -1
          du -sh /home/asher/app/data /home/asher/app/РЕЗЕРВНЫЕ-КОПИИ /var/log/journal 2>/dev/null
          echo "=== память ==="
          free -m
          echo "=== службы ==="
          for s in asher caddy; do echo "$s: $(systemctl is-active $s) (с $(systemctl show -p ActiveEnterTimestamp --value $s)), перезапусков: $(systemctl show -p NRestarts --value $s)"; done
          systemctl status asher --no-pager -n 0 2>/dev/null | sed -n '1,12p' | mask
          echo "--- кто слушает 80/443/3000 ---"
          ss -lntp 2>/dev/null | awk 'NR==1 || /:(80|443|3000) /' | mask
          echo "--- самые прожорливые процессы ---"
          ps -eo pid,etime,pcpu,pmem,rss,comm --sort=-pcpu | head -8
          echo "=== версия системы ==="
          cd /home/asher/app && sudo -u asher git log -1 --format='%h %ci %s' 2>/dev/null
          echo "=== ответ системы изнутри (минуя Caddy) ==="
          curl -sS --max-time 15 -o /tmp/p.txt -w "код %{http_code}, %{time_total}s\n" http://127.0.0.1:3000/api/ping || echo "(система не ответила за 15 секунд)"
          head -c 200 /tmp/p.txt 2>/dev/null; echo
          echo "=== через Caddy изнутри ==="
          curl -sS --max-time 15 -o /dev/null -w "код %{http_code}, %{time_total}s\n" --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/api/ping" || echo "(Caddy не ответил за 15 секунд)"
          echo "=== брандмауэр ==="
          ufw status 2>/dev/null | head -12
          echo "=== нехватка памяти (за 10 дней) ==="
          journalctl -k --since "-10 days" --no-pager 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -8 | mask
          echo "=== журнал системы, последние строки ==="
          journalctl -u asher -n 70 --no-pager 2>/dev/null | mask
          echo "=== журнал Caddy, предупреждения и ошибки ==="
          journalctl -u caddy --since "-3 days" -p warning -n 25 --no-pager 2>/dev/null | mask
          REMOTE
          cat изнутри.log | grep -v -iE 'пароль|password'
          if [ "$RC" = 255 ]; then echo; echo "На сервер не пускает по SSH (порт $PORT): сервер выключен, недоступен или сменился пароль."; fi
          exit "$RC"
