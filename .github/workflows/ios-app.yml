# Приложение для iPhone: сборка и отправка в App Store.
#
# Своего компьютера Mac у нас нет, а собрать приложение для iPhone можно
# только на нём. Поэтому собирает робот GitHub — на их Mac, с их Xcode.
#
# При каждой правке в ios/ робот только проверяет, что приложение собирается
# (сборка для симулятора, без подписи и ключей).
#
# Запуск кнопкой (Actions → «Приложение для iPhone» → Run workflow) — это уже
# выпуск: подпись, загрузка в App Store Connect и, если отмечено, отправка
# на проверку Apple. Нужны секреты:
#   ASC_ISSUER_ID, ASC_KEY_ID, ASC_KEY_P8 — ключ App Store Connect (роль Admin);
#   REVIEW_CONTACT — «Имя;Фамилия;+996…;почта» человека, которому Apple
#                    позвонит или напишет, если у проверяющего будут вопросы.
# Подробно — в инструкции владельцу. Сам робот — ios/tools/appstore.mjs.
name: Приложение для iPhone

on:
  workflow_dispatch:
    inputs:
      submit:
        description: После загрузки отправить на проверку Apple
        type: boolean
        default: false
  push:
    branches: [claude/server-connection-yv2kwg]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-app.yml'

jobs:
  app:
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      REVIEW_CONTACT: ${{ secrets.REVIEW_CONTACT }}
      # Номер сборки растёт с каждым запуском, а повторный запуск того же
      # прогона получает свою дробь: Apple не принимает одну сборку дважды.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Выбираю Xcode
        run: |
          # Самый свежий НЕ бета-выпуск: сборку из бета-версии Xcode
          # App Store не принимает, а слишком старую — тоже.
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "беру: $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Ставлю XcodeGen
        run: brew install xcodegen

      - name: Собираю проект Xcode из описания
        working-directory: ios
        run: xcodegen generate

      - name: Проверочная сборка для симулятора
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Diamonds.xcodeproj -scheme Diamonds -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee сборка.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" сборка.log

      - name: Выпуск или только проверка
        id: mode
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "release=0" >> "$GITHUB_OUTPUT"
            echo "Правка в коде — только проверочная сборка. Выпуск — запуском кнопкой."
          elif [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Нет ключа App Store Connect: добавьте секреты ASC_ISSUER_ID, ASC_KEY_ID и ASC_KEY_P8 (см. инструкцию)."
            exit 1
          else
            echo "release=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Ключ работает? Есть ли карточка приложения?
        if: steps.mode.outputs.release == '1'
        run: node ios/tools/appstore.mjs check --need-app

      - name: Одноразовый сертификат и профиль подписи
        id: sign
        if: steps.mode.outputs.release == '1'
        run: |
          # Закрытый ключ рождается здесь и здесь же умирает вместе с машиной.
          # Apple выдаёт к нему сертификат, робот в конце его отзывает.
          S="$RUNNER_TEMP/signing"
          mkdir -p "$S"
          /usr/bin/openssl genrsa -out "$S/dist.key" 2048 2>/dev/null
          /usr/bin/openssl req -new -key "$S/dist.key" -out "$S/dist.csr" -subj "/CN=Diamonds robot/O=Diamonds/C=KG"
          node ios/tools/appstore.mjs prepare-signing --csr "$S/dist.csr" --out "$S" --run "${{ github.run_id }}"

      - name: Связка ключей и профиль для Xcode
        if: steps.mode.outputs.release == '1'
        env:
          PROFILE_UUID: ${{ steps.sign.outputs.profile_uuid }}
        run: |
          S="$RUNNER_TEMP/signing"
          PASS="$(/usr/bin/openssl rand -hex 16)"
          echo "::add-mask::$PASS"
          # Именно /usr/bin/openssl: он упаковывает ключ по-старому, как понимает
          # связка ключей macOS. Новый OpenSSL 3 упаковывает иначе, и «security
          # import» отвечает невнятной ошибкой.
          /usr/bin/openssl x509 -inform DER -in "$S/distribution.cer" -out "$S/dist.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$S/dist.key" -in "$S/dist.pem" -out "$S/dist.p12" -passout "pass:$PASS"
          KC="$RUNNER_TEMP/diamonds.keychain-db"
          security create-keychain -p "$PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PASS" "$KC"
          # Промежуточный сертификат Apple — без него подпись не выстраивает цепочку.
          if curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$S/wwdr.cer"; then
            security import "$S/wwdr.cer" -k "$KC" >/dev/null || true
          fi
          security import "$S/dist.p12" -k "$KC" -P "$PASS" -f pkcs12 -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$S/profile.mobileprovision" "$d/$PROFILE_UUID.mobileprovision"
          done
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Архив для App Store
        if: steps.mode.outputs.release == '1'
        working-directory: ios
        env:
          TEAM_ID: ${{ steps.sign.outputs.team_id }}
          PROFILE_NAME: ${{ steps.sign.outputs.profile_name }}
        run: |
          set -o pipefail
          echo "сборка номер $BUILD_NUMBER"
          xcodebuild -project Diamonds.xcodeproj -scheme Diamonds -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Diamonds.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive 2>&1 | tee архив.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" архив.log

      - name: Загружаю в App Store Connect
        if: steps.mode.outputs.release == '1'
        env:
          TEAM_ID: ${{ steps.sign.outputs.team_id }}
          PROFILE_NAME: ${{ steps.sign.outputs.profile_name }}
        run: |
          set -o pipefail
          K="$RUNNER_TEMP/signing/AuthKey_$ASC_KEY_ID.p8"
          node ios/tools/appstore.mjs pem --env ASC_KEY_P8 --out "$K"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>kg.diamonds.crm</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Diamonds.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$K" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee выгрузка.log | tail -40

      - name: Жду, пока Apple обработает сборку
        if: steps.mode.outputs.release == '1'
        run: node ios/tools/appstore.mjs wait-build --build "$BUILD_NUMBER"

      - name: Отзываю одноразовый сертификат
        # После обработки сборки сертификат больше не нужен: Apple подписывает
        # приложение для App Store своим. Отзываем и при неудаче — всегда.
        if: always() && steps.mode.outputs.release == '1'
        run: |
          node ios/tools/appstore.mjs cleanup-signing --out "$RUNNER_TEMP/signing" || true
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/signing"

      - name: Описание, скриншоты и отправка на проверку
        if: steps.mode.outputs.release == '1'
        run: |
          if [ "${{ inputs.submit }}" = "true" ]; then
            node ios/tools/appstore.mjs submit --build "$BUILD_NUMBER" --version 1.0
          else
            # Без галочки — всё заполняется, но на проверку не уходит: можно
            # посмотреть карточку на сайте и отправить потом.
            node ios/tools/appstore.mjs submit --build "$BUILD_NUMBER" --version 1.0 --dry 1
          fi
