<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121110">
  <title>Asher Diamonds — CRM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a5813a' stroke-width='1.6'%3E%3Cpath d='M7 3h10l4 6-9 12L3 9l4-6z'/%3E%3Cpath d='M3 9h18M9.5 3 8 9l4 12M14.5 3 16 9l-4 12'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <!-- Экран входа -->
  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-gem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M7 3h10l4 6-9 12L3 9l4-6z"/><path d="M3 9h18M9.5 3 8 9l4 12M14.5 3 16 9l-4 12"/></svg></div>
        <h1 id="login-title">Asher</h1>
        <p class="login-sub" id="login-sub">Diamonds</p>
      </div>
      <form id="login-form">
        <label class="field">
          <span>Логин</span>
          <input type="text" id="login-username" autocomplete="username" autocapitalize="none" required>
        </label>
        <label class="field">
          <span>Пароль</span>
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
        <div id="login-error" class="login-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block">Войти</button>
      </form>
    </div>
  </div>

  <!-- Приложение -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-gem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M7 3h10l4 6-9 12L3 9l4-6z"/><path d="M3 9h18M9.5 3 8 9l4 12M14.5 3 16 9l-4 12"/></svg></span>
        <div>
          <div class="brand-name" id="brand-name">Asher</div>
          <div class="brand-sub" id="brand-sub">Diamonds</div>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">А</div>
          <div class="user-info">
            <div class="user-name" id="user-name">—</div>
            <div class="user-role" id="user-role">—</div>
          </div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Выйти"></button>
      </div>
    </aside>

    <div class="main-wrap">
      <!-- Шапка телефона -->
      <div class="mobile-head">
        <div class="mh-brand" id="brand-name-mobile-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M7 3h10l4 6-9 12L3 9l4-6z"/><path d="M3 9h18M9.5 3 8 9l4 12M14.5 3 16 9l-4 12"/></svg>
          <span id="brand-name-mobile">Asher</span>
        </div>
        <button data-theme-icon id="btn-theme-mobile" title="Сменить тему"></button>
        <button id="btn-more" title="Все разделы"></button>
      </div>

      <header class="topbar">
        <h1 id="page-title" class="page-title">—</h1>
        <div class="topbar-actions">
          <button class="theme-toggle" data-theme-icon id="btn-theme" title="Сменить тему"></button>
          <button class="btn btn-primary" id="btn-quick-sale"></button>
        </div>
      </header>
      <main id="page" class="page"></main>
    </div>

    <!-- Нижняя навигация телефона -->
    <nav class="mobile-nav" id="mobile-nav"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <div id="print-root" class="print-root"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/photos.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/products.js"></script>
  <script src="/js/pages/customers.js"></script>
  <script src="/js/pages/sales.js"></script>
  <script src="/js/pages/debts.js"></script>
  <script src="/js/pages/orders.js"></script>
  <script src="/js/pages/inventory.js"></script>
  <script src="/js/pages/labels.js"></script>
  <script src="/js/pages/finance.js"></script>
  <script src="/js/pages/analytics.js"></script>
  <script src="/js/pages/import.js"></script>
  <script src="/js/pages/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
